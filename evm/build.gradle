apply plugin: 'java-library'
apply plugin: 'idea'

jar {
  archiveBaseName = calculateArtifactId(project)
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'org.hyperledger.besu.evm'
      )
  }
}

dependencies {
  api 'org.slf4j:slf4j-api'

  annotationProcessor 'com.google.dagger:dagger-compiler'

  implementation project(':crypto:algorithms')
  implementation project(':datatypes')
  implementation project(':ethereum:rlp')
  implementation project(':util')

  implementation 'com.github.ben-manes.caffeine:caffeine'
  implementation 'com.google.guava:guava'
  compileOnly 'com.google.errorprone:error_prone_annotations'
  implementation 'com.google.dagger:dagger'
  implementation 'net.java.dev.jna:jna'
  implementation 'io.consensys.tuweni:tuweni-bytes'
  implementation 'io.consensys.tuweni:tuweni-units'
  implementation 'org.hyperledger.besu:arithmetic'
  implementation 'org.hyperledger.besu:gnark'
  implementation 'org.hyperledger.besu:secp256k1'
  implementation 'org.hyperledger.besu:boringssl'
  implementation 'io.consensys.protocols:jc-kzg-4844'

  compileOnly 'com.fasterxml.jackson.core:jackson-databind'
  compileOnly 'org.jspecify:jspecify'
  compileOnly 'io.vertx:vertx-core'

  testImplementation 'com.fasterxml.jackson.core:jackson-databind'
  testImplementation 'info.picocli:picocli'
  testImplementation 'net.jqwik:jqwik:1.9.3'
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      pom {
        name = 'Besu EVM'
        description = 'EVM Engine component'
      }
    }
  }
}

// The untraced EVM v2 loop runs copies of the most frequent operations' code. The copies are
// generated into EVM.java from the operation classes, and every build checks that they are current.
sourceSets {
  loopgen
}

dependencies {
  loopgenAnnotationProcessor(platform(project(':platform')))
  // EvmV2LoopGeneratorTest runs the generator on a small example of an operation
  testImplementation sourceSets.loopgen.output
}

def evmV2LoopSources = 'src/main/java'

tasks.register('generateEvmV2Loop', JavaExec) {
  group = 'build'
  description = 'Copies the most frequent EVM v2 operations\' code into the untraced loop in EVM.java'
  classpath = sourceSets.loopgen.runtimeClasspath
  mainClass = 'org.hyperledger.besu.evm.loopgen.EvmV2LoopGenerator'
  workingDir = projectDir
  argumentProviders.add({
    [
      'write',
      evmV2LoopSources,
      sourceSets.main.compileClasspath.asPath
    ]
  } as CommandLineArgumentProvider)
  finalizedBy 'spotlessApply'
}

def checkEvmV2Loop = tasks.register('checkEvmV2Loop', JavaExec) {
  group = 'verification'
  description = 'Checks that EVM.java holds the current copies of the operations\' code the untraced EVM v2 loop runs'
  classpath = sourceSets.loopgen.runtimeClasspath
  mainClass = 'org.hyperledger.besu.evm.loopgen.EvmV2LoopGenerator'
  workingDir = projectDir
  def marker = layout.buildDirectory.file('evmV2Loop/checked')
  inputs.dir(evmV2LoopSources)
  inputs.files(sourceSets.loopgen.runtimeClasspath)
  inputs.files(sourceSets.main.compileClasspath)
  outputs.file(marker)
  argumentProviders.add({
    [
      'check',
      evmV2LoopSources,
      sourceSets.main.compileClasspath.asPath,
      marker.get().asFile.path
    ]
  } as CommandLineArgumentProvider)
}

tasks.named('compileJava') {
  dependsOn checkEvmV2Loop
}
