# SPDX-License-Identifier: Apache-2.0
name: devnet-tests

on:
  workflow_call:

env:
  GRADLE_OPTS: "-Xmx6g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  actions: read
  contents: read

jobs:
  # One job runs both consume tasks on EVM v1 and then on EVM v2. Each task takes a few minutes, so
  # separate jobs mostly repeated checkout, setup and fixture extraction, and each waited for its own
  # besu-research-ubuntu-8 runner.
  devnetTests:
    runs-on: besu-research-ubuntu-8 # the devnet fixtures need the extra disk space
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Each step runs even if an earlier one failed, so one run reports every failing combination.
      # --continue keeps the second task running when the first fails.
      - name: Run consume tasks on EVM v1
        run: ./gradlew --continue :ethereum:evmtool:consumeEngineTestsStable :ethereum:evmtool:consumeRlpTestsStable
      # EVM v2 is behind the experimental --Xevm-v2 flag; this keeps it in consensus with EVM v1.
      # test.evm.v2 is read when the build is configured, so v2 needs its own Gradle invocation.
      - name: Run consume tasks on EVM v2
        if: success() || failure()
        run: ./gradlew --continue :ethereum:evmtool:consumeEngineTestsStable :ethereum:evmtool:consumeRlpTestsStable -Dtest.evm.v2=true

  devnetTestsPassed:
    name: devnetTestsPassed
    runs-on: ubuntu-latest
    needs: [devnetTests]
    permissions:
      contents: read
    if: always()
    steps:
      - name: Fail on workflow error
        run: exit 1
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
